name: Cron Publish Scheduled

on:
  schedule:
    # A cada 5 minutos (minimo do GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-scheduled
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X GET \
            -H "Content-Type: application/json" \
            "https://stackpost.expostacker.com.br/api/cron/publish-scheduled")
          echo "$RESP"
      - name: Trigger refresh-tokens
        run: |
          curl -s -X GET \
            "https://stackpost.expostacker.com.br/api/cron/refresh-tokens" \
            -o /dev/null -w "refresh-tokens: %{http_code}\n"
