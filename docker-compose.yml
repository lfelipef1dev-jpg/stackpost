services:
  postgres:
    image: postgres:16-alpine
    container_name: stackpost-postgres
    environment:
      POSTGRES_USER: stackpost
      POSTGRES_PASSWORD: stackpost
      POSTGRES_DB: stackpost
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stackpost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
